# OpenCut 桌面端（Tauri 2）
# 独立 workspace：Tauri 依赖较重，不并入根 workspace，避免拖慢全量编译
[workspace]

[package]
name = "opencut"
version = "0.1.0"
description = "OpenCut 视频剪辑器桌面端"
authors = ["opencut"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "opencut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
